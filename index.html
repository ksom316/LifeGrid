<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Life Grid — a private, local-first personal operating system." />
    <meta name="theme-color" content="#12151e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Life Grid</title>
    <script>
      // Applies a saved manual theme choice before first paint, so the page
      // never flashes dark-then-light (or vice versa) while React loads.
      // Mirrors ThemeContext's own storage key/values exactly; kept here as
      // plain inline JS (not an import) because it must block rendering.
      (function () {
        try {
          var stored = localStorage.getItem('life-grid-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
